<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guinea Pig Sanctuary</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Guinea Pig Sanctuary</h1>
      <p class="intro">
        A small, shared meadow. Right now there's one guinea pig here —
        <strong>Potato</strong> — and whatever you leave behind stays for the
        next visitor.
      </p>

      <section class="meadow-wrap">
        <p class="guinea-pig">
          🐹 <span id="pig-name">Potato</span> is in the meadow, looking
          <span id="pig-personality">curious</span>.
        </p>
        <p id="trace" aria-live="polite">Loading the sanctuary's memory…</p>
        <button id="feed-button" type="button">Feed Potato</button>

        <div
          id="meadow"
          class="meadow"
          role="button"
          tabindex="0"
          aria-label="The meadow. Click or press Enter to plant a flower where you are."
        ></div>
        <p id="flower-trace" aria-live="polite"></p>
      </section>

      <p class="footer">
        <a href="/readme/">What "good" means for this place →</a>
      </p>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
